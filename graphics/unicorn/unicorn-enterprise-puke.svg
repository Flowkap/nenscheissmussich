<svg xmlns="http://www.w3.org/2000/svg" viewBox="-146 110 1568 1180" role="img" aria-labelledby="t">
  <title id="t">Unicorn in a business suit leaning back in a swivel office chair, puking a washed-out rainbow</title>
  <defs>
    <linearGradient id="chair-back" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b886cf"/>
      <stop offset="0.25" stop-color="#9a6cb5"/>
      <stop offset="1" stop-color="#8a5fa6"/>
    </linearGradient>
    <clipPath id="horn-clip">
      <path d="M238 545 L462 408 C482 420 494 452 498 486 Z"/>
    </clipPath>
    <path id="beam-centre" d="M628 372 C720 170 1010 120 1100 1238"/>
  </defs>
  <style>
    .beam { transform-box: view-box; transform-origin: 628px 372px; animation: gush 0.7s ease-in-out infinite alternate; }
    .band { fill: none; stroke-width: 18; stroke-linecap: round; stroke-dasharray: 190 19; animation: flow 0.45s linear infinite; }
    .splash circle { transform-box: fill-box; transform-origin: center; animation: drop 0.9s ease-out infinite; }
    @keyframes gush {
      from { transform: rotate(2deg) scale(0.98); }
      to   { transform: rotate(-1.5deg) scale(1.02); }
    }
    @keyframes flow { to { stroke-dashoffset: -209; } }
    @keyframes drop {
      0%   { opacity: 0; transform: translate(0, 0); }
      20%  { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--x), var(--y)); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

