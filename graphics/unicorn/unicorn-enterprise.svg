             L-32 46 C-36 28 -28 16 -12 16 L32 14 C26 -14 34 -42 56 -58 Z" fill="#33405f"/>
    <path d="M150 -56 C162 -26 162 4 156 34" fill="none" stroke="#4d5c82" stroke-width="5"/>
    <path d="M34 12 C70 20 120 20 156 12" fill="none" stroke="#26304a" stroke-width="4"/>
    <path d="M-20 56 L-22 128" fill="none" stroke="#4d5c82" stroke-width="4"/>
    <rect x="-42" y="132" width="42" height="14" rx="7" fill="#17171d"/>
    <!-- collar, shirt and tie -->
    <path d="M62 -62 L92 -62 L78 -18 Z" fill="#f5f6f8" stroke-width="4"/>
    <path d="M60 -66 L76 -48 L80 -64 M96 -66 L80 -48" fill="#f5f6f8" stroke-width="4"/>
    <clipPath id="tie-shape"><path d="M74 -54 L84 -54 L88 -8 L79 4 L70 -8 Z"/></clipPath>
    <path d="M74 -54 L84 -54 L88 -8 L79 4 L70 -8 Z" fill="#c22846" stroke-width="4"/>
    <g clip-path="url(#tie-shape)" stroke="#8a1530" stroke-width="3.5"><path d="M66 -44 L92 -34 M66 -28 L92 -18 M66 -12 L92 -2"/></g>
    <path d="M74 -54 L84 -54 L88 -8 L79 4 L70 -8 Z" fill="none" stroke-width="4"/>
    <path d="M73 -62 H85 L83 -53 H75 Z" fill="#c22846" stroke-width="4"/>
    <path d="M58 -56 C46 -34 42 -12 44 10 L62 -24 Z" fill="#232c45" stroke-width="4"/>
    <path d="M104 -34 L120 -40 L124 -32 L108 -26 Z" fill="#ee7fd2" stroke-width="3.5"/>
    <path d="M100 -30 L128 -40" fill="none" stroke-width="4"/>
    <!-- ears and horn of the original, in front of the collar -->
    <g transform="translate(-262.0 -175.4) scale(0.42)" stroke-width="10.5">
      <path d="M930 228 C960 270 1000 304 1048 318 C1036 278 1004 246 962 222 Z" fill="#ee7fd2"/>
      <path d="M956 240 C978 270 1004 292 1030 304" fill="none" stroke="#d55db8" stroke-width="10"/>
      <path d="M868 228 C878 290 916 344 976 368 C976 316 950 266 914 236 Z" fill="#ee7fd2"/>
      <path d="M888 248 C898 294 922 328 956 348" fill="none" stroke-width="7"/>
      <clipPath id="horn-shape"><path d="M920 159 L1124 272 Q1132 282 1119 285 L890 241 Q892 195 920 159 Z"/></clipPath>
      <path d="M920 159 L1124 272 Q1132 282 1119 285 L890 241 Q892 195 920 159 Z" fill="url(#horn-silver)" stroke="none"/>
      <g clip-path="url(#horn-shape)">
        <path d="M894 260 L976 162" stroke="#3c3f45" stroke-width="15" opacity="0.75"/>
        <path d="M933 274 L1015 176" stroke="#3c3f45" stroke-width="13" opacity="0.75"/>
        <path d="M972 288 L1054 190" stroke="#3c3f45" stroke-width="12" opacity="0.75"/>
        <path d="M1011 302 L1093 204" stroke="#3c3f45" stroke-width="11" opacity="0.75"/>
        <path d="M1050 316 L1132 218" stroke="#3c3f45" stroke-width="9" opacity="0.75"/>
        <path d="M916 172 C980 196 1050 226 1112 262" fill="none" stroke="#ffffff" stroke-width="9" opacity="0.85"/>
      </g>
      <path d="M920 159 L1124 272 Q1132 282 1119 285 L890 241 Q892 195 920 159 Z" fill="none"/>
    </g>
    <!-- armrest and an arm that grows out of the shoulder -->
    <rect x="114" y="10" width="10" height="38" fill="#3a3f49"/>
    <rect x="58" y="2" width="96" height="12" rx="6" fill="#3a3f49"/>
    <path d="M132 -56 C140 -24 134 -4 116 0 L48 0" fill="none" stroke-width="24" stroke-linecap="butt"/>
    <path d="M132 -60 C140 -24 134 -4 116 0 L48 0" fill="none" stroke="#33405f" stroke-width="15" stroke-linecap="butt"/>
    <path d="M58 0 H44" fill="none" stroke="#f5f6f8" stroke-width="15" stroke-linecap="butt"/>
    <circle cx="52" cy="0" r="3" fill="#f2c94c" stroke-width="2"/>
    <circle cx="36" cy="0" r="11" fill="#ee7fd2"/>
  </g>
  <g class="splash" stroke="none">
    <ellipse cx="-212" cy="174" rx="34" ry="8" fill="#b0b4ba" stroke="#2b1d26" stroke-width="2.5"/>
    <ellipse cx="-220" cy="172" rx="12" ry="2.5" fill="#fff" opacity="0.6"/>
    <circle cx="-216" cy="166" r="5" fill="#4b4f57" style="--x:-26px;--y:-30px"/>
    <circle cx="-212" cy="166" r="4" fill="#8d929a" style="--x:22px;--y:-36px;animation-delay:-0.3s"/>
    <circle cx="-214" cy="166" r="4.5" fill="#6b7079" style="--x:-8px;--y:-44px;animation-delay:-0.6s"/>
    <circle cx="-210" cy="166" r="3.5" fill="#b0b4ba" style="--x:26px;--y:-20px;animation-delay:-0.45s"/>
  </g>
