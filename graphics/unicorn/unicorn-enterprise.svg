<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-250 -215 545 410" role="img" aria-labelledby="t">
  <title id="t">Unicorn in a business suit on a swivel office chair, puking a grey rainbow full of meeting invites</title>
  <defs>
    <linearGradient id="horn-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#e3e6ea"/>
      <stop offset="0.7" stop-color="#a7adb5"/>
      <stop offset="1" stop-color="#6c727b"/>
    </linearGradient>
    <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#4a505b"/>
      <path d="M0 0 H8 M0 0 V8" stroke="#363b44" stroke-width="1.6"/>
    </pattern>
    <path id="beam-centre" d="M66 -112 C-10 -215 -195 -218 -214 168"/>
    <!-- meeting invites, the chunks in the beam -->
    <g id="invite" stroke="#2b1d26" stroke-width="1.6" stroke-linejoin="round">
      <rect x="-13" y="-12" width="26" height="25" rx="3" fill="#f2f3f5"/>
      <path d="M-13 -5 V-9 A3 3 0 0 1 -10 -12 H10 A3 3 0 0 1 13 -9 V-5 Z" fill="#6b7079"/>
      <path d="M-6 -15 V-9 M6 -15 V-9" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <g id="invite-1on1">
      <use href="#invite" xlink:href="#invite"/>
      <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="7.5" fill="#2f3238" text-anchor="middle"><text x="0" y="8">1:1</text></g>
    </g>
    <g id="invite-sync">
      <use href="#invite" xlink:href="#invite"/>
      <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="7.5" fill="#2f3238" text-anchor="middle"><text x="0" y="8">Sync</text></g>
    </g>
    <g id="invite-jf">
      <use href="#invite" xlink:href="#invite"/>
      <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="7.5" fill="#2f3238" text-anchor="middle"><text x="0" y="3.5">Jour</text><text x="0" y="10.5">fixe</text></g>
    </g>
  </defs>
  <style>
    .beam { transform-box: view-box; transform-origin: 66px -112px; animation: gush 0.7s ease-in-out infinite alternate; }
    .band { fill: none; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 70 7; animation: flow 0.45s linear infinite; }
    .splash circle { transform-box: fill-box; transform-origin: center; animation: drop 0.9s ease-out infinite; }
    @keyframes gush {
      from { transform: rotate(2deg) scale(0.98); }
      to   { transform: rotate(-1.5deg) scale(1.02); }
    }
    @keyframes flow { to { stroke-dashoffset: -77; } }
    @keyframes drop {
      0%   { opacity: 0; transform: translate(0, 0); }
      20%  { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--x), var(--y)); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .invite-chunk { display: none; }
    }
  </style>
  <g stroke="#2b1d26" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- swivel chair, side view, facing left -->
    <g id="chair">
      <path d="M160 72 C176 60 186 40 190 12" fill="none" stroke-width="16"/>
      <path d="M160 72 C176 60 186 40 190 12" fill="none" stroke="#6b7079" stroke-width="7"/>
      <rect x="168" y="-142" width="46" height="158" rx="20" fill="url(#mesh)" transform="rotate(7 191 -63)"/>
      <path d="M75 140 L-30 152 M75 140 L180 152 M75 140 L75 156" fill="none" stroke-width="16"/>
      <path d="M75 140 L-30 152 M75 140 L180 152 M75 140 L75 156" fill="none" stroke="#3a3f49" stroke-width="8"/>
      <g fill="#22252b">
        <circle cx="-30" cy="164" r="11"/><circle cx="75" cy="166" r="11"/><circle cx="180" cy="164" r="11"/>
      </g>
      <ellipse cx="75" cy="140" rx="20" ry="7" fill="#3a3f49"/>
      <rect x="67" y="80" width="16" height="60" fill="#9aa0a8"/>
      <rect x="30" y="72" width="92" height="12" rx="3" fill="#30343c"/>
      <rect x="-38" y="46" width="206" height="32" rx="16" fill="#4a505b"/>
      <path d="M-22 53 H150" fill="none" stroke="#6a707b" stroke-width="5"/>
    </g>
    <!-- far leg -->
    <path d="M-2 40 L-8 136 H18 L26 40 Z" fill="#26304a"/>
    <rect x="-14" y="132" width="40" height="14" rx="7" fill="#17171d"/>
    <!-- head and neck in the shape and coordinates of the original unicorn -->
    <g transform="translate(-262.0 -175.4) scale(0.42)" stroke-width="10.5">
      <path d="M760 430 L760 270 C792 232 792 164 772 116 C752 84 742 42 772 20 C804 -2 880 0 910 40
               C950 90 952 160 936 210 C930 258 962 298 950 340 L950 430 Z" fill="#ee7fd2"/>
      <circle cx="846" cy="22" r="9" fill="#2b1d26" stroke="none"/>
      <!-- dead tired eye: heavy flat lid, pupil sunk to the bottom, bags underneath -->
      <clipPath id="eye-shape"><ellipse cx="877" cy="136" rx="25" ry="17"/></clipPath>
      <ellipse cx="877" cy="136" rx="25" ry="17" fill="#f4f1ea" stroke="none"/>
      <g clip-path="url(#eye-shape)" stroke="none">
        <circle cx="872" cy="148" r="7" fill="#2b1d26"/>
        <path d="M840 100 H915 V139 L840 136 Z" fill="#e070c2"/>
      </g>
      <ellipse cx="877" cy="136" rx="25" ry="17" fill="none" stroke-width="7"/>
      <path d="M851 136.5 L903 139" fill="none" stroke-width="7"/>
      <path d="M854 162 C866 170 888 170 900 160" fill="none" stroke="#b14e8c" stroke-width="5"/>
      <path d="M860 172 C872 178 886 177 894 171" fill="none" stroke="#b14e8c" stroke-width="4" opacity="0.7"/>
      <!-- wide open mouth at the front -->
      <path d="M781 134 C790 176 826 196 862 186 C836 176 808 160 786 122 Z" fill="#5a1d3c" stroke-width="8"/>
    </g>
    <!-- suit: torso, lap and near leg in one piece -->
