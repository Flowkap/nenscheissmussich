<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nenscheissmussi.ch</title>
  <meta name="description" content="Under construction.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="avatar.png">
  <style>
    :root {
      --bg: #f6f4ef;
      --fg: #1c1c1c;
      --muted: #6b6b6b;
      --accent: #e8c95a;
      --stripe-dark: #1c1c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --fg: #f2f2f2;
        --muted: #9a9a9a;
        --stripe-dark: #000000;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .tape {
      height: 18px;
      background: repeating-linear-gradient(
        -45deg,
        var(--accent) 0 18px,
        var(--stripe-dark) 18px 36px
      );
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem 1rem;
      text-align: center;
    }
    .avatar {
      width: min(220px, 55vw);
      height: auto;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 4px solid var(--accent);
    }
    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 6vw, 3rem);
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      max-width: 32rem;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.5;
    }
    footer {
      padding: 1rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <div class="tape" aria-hidden="true"></div>
  <main>
    <img class="avatar" src="avatar.png" alt="Flowkap avatar" width="220" height="220">
    <h1>🚧 Under Construction 🚧</h1>
    <p>Hier entsteht gerade was. Schau später nochmal vorbei.</p>
  </main>
  <footer>
    <a href="https://flowkap.dev">flowkap.dev</a>
  </footer>
  <div class="tape" aria-hidden="true"></div>
</body>
</html>
