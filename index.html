<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nenscheissmussi.ch</title>
  <meta name="description" content="'Nen Scheiss muss ich!">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="avatar.png">
  <style>
    :root {
      --paper: #e8e9f5;
      --wave: #5b8fd6;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--paper);
    }
    .waves {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .wave {
      fill: none;
      stroke: var(--wave);
      stroke-width: var(--stroke, 6px);
      stroke-linecap: round;
      opacity: 0.9;
      transform-box: fill-box;
      animation: wave var(--d) ease-in-out var(--delay) infinite alternate;
    }
    @keyframes wave {
      from { transform: translate(calc(var(--dx) * -1), 4px) scaleX(0.96); }
      to   { transform: translate(var(--dx), -4px) scaleX(1.04); }
    }
    .stage {
      position: fixed;
      inset: 0;
    }
    .drift {
      position: absolute;
      animation: drift var(--drift) ease-in-out var(--delay) infinite alternate;
    }
    @keyframes drift {
      from { transform: translateX(calc(var(--amp) * -1)); }
      to   { transform: translateX(var(--amp)); }
    }
    .bob {
      transform-origin: 50% 75%;
      animation: bob var(--bob) ease-in-out var(--delay) infinite;
    }
    /* rise on the crest, tilt on the slope, settle in the trough */
    @keyframes bob {
      0%   { transform: translateY(0) rotate(-4deg); }
      25%  { transform: translateY(-4%) rotate(1deg); }
      50%  { transform: translateY(1%) rotate(4deg); }
      75%  { transform: translateY(-2.5%) rotate(-1deg); }
      100% { transform: translateY(0) rotate(-4deg); }
    }
    .drift img {
      display: block;
      width: 100%;
      height: auto;
    }
    .drift img.mirrored { transform: scaleX(-1); }
    .lettering {
      position: fixed;
      left: 50%;
      top: 47%;
      width: min(92vw, 1400px);
      transform: translate(-50%, -50%);
      animation: lettering 4.5s ease-in-out infinite;
    }
    .lettering img { display: block; width: 100%; height: auto; }
    @keyframes lettering {
      0%, 100% { transform: translate(-50%, -50%) rotate(-0.6deg); }
      50%      { transform: translate(-50%, -54%) rotate(0.6deg); }
    }
    .backlink {
      position: fixed;
      left: 50%;
      bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateX(-50%);
      padding: 4px 6px 4px 14px;
      border-radius: 999px;
      background: rgba(232, 233, 245, 0.88);
      color: #2b1d26;
      font: 0.85rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      white-space: nowrap;
    }
    .backlink a { color: inherit; }
    .info-button {
      width: 24px;
      height: 24px;
      padding: 0;
      border: 2px solid currentColor;
      border-radius: 50%;
      background: none;
      color: inherit;
      font: 700 0.8rem/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      cursor: pointer;
    }
    .details {
      max-width: min(420px, calc(100vw - 32px));
      padding: 0;
      border: 0;
      border-radius: 16px;
      background: #e8e9f5;
      color: #2b1d26;
      box-shadow: 0 12px 40px rgba(43, 29, 38, 0.3);
      font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .details::backdrop { background: rgba(43, 29, 38, 0.45); }
    .details-body { padding: 20px 24px; }
    .details-body p { margin: 0 0 12px; }
    .details-body a { color: inherit; }
    .details-body button {
      padding: 6px 16px;
      border: 2px solid currentColor;
      border-radius: 999px;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    @media (orientation: portrait) {
      .lettering { top: 46%; width: 88vw; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <svg class="waves" id="waves" aria-hidden="true"></svg>
  <div class="stage" id="stage" aria-hidden="true"></div>
  <div class="lettering">
    <picture>
      <source media="(orientation: portrait)" srcset="graphics/lettering/lettering-stacked.svg">
      <img src="graphics/lettering/lettering.svg" alt="'Nen Scheiss muss ich!">
    </picture>
  </div>
  <footer class="backlink">
    <a href="https://flowkap.dev">flowkap.dev</a>
    ·
    <a href="https://flowkap.dev/imprint/">Imprint</a>
    <button class="info-button" type="button" id="details-open" aria-haspopup="dialog" aria-label="Details">?</button>
  </footer>
  <dialog class="details" id="details" aria-label="Details">
    <div class="details-body">
      <p>Original von Flowkap: <a href="graphics/original/original.png">Link</a></p>
      <p>Coffeeware: Nimm's gern her – wenn's dir gefällt, spendier mir einen Kaffee ☕</p>
      <form method="dialog"><button>Schließen</button></form>
    </div>
  </dialog>
  <script>
    (() => {
      const details = document.getElementById("details");
      document.getElementById("details-open").addEventListener("click", () => details.showModal());
      // a click outside the body lands on the dialog element itself, i.e. the backdrop
      details.addEventListener("click", (event) => {
        if (event.target === details) details.close();
      });

      const stage = document.getElementById("stage");
      const UNICORN = "graphics/unicorn/unicorn-float.svg";
      const RATIO = 410 / 545;
      // relative widths of the three size classes
      const LARGE = 1;
      const MEDIUM = 0.7;
      const SMALL = 0.45;

      const seeded = (seed) => () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };
      const box = (rect, pad) => ({
        l: rect.left - pad, t: rect.top - pad, r: rect.right + pad, b: rect.bottom + pad,
      });
      const overlaps = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;

      // new arrangement on every page load, stable while the window is resized
      const layoutSeed = Math.floor(Math.random() * 4294967296);
      const centre = (b) => [(b.l + b.r) / 2, (b.t + b.b) / 2];

      const waves = document.getElementById("waves");
      const SVG_NS = "http://www.w3.org/2000/svg";

      function wavePath(x, y, w, amp) {
        const step = w / 3;
        let d = `M${x} ${y + amp}`;
        for (let i = 0; i < 3; i++) {
          const x0 = x + i * step;
          d += ` C${x0 + step * 0.25} ${y - amp}, ${x0 + step * 0.5} ${y - amp}, ${x0 + step * 0.6} ${y + amp * 0.2}` +
            ` S${x0 + step * 0.9} ${y + amp}, ${x0 + step} ${y + amp * 0.1}`;
        }
        return d;
      }

      // jittered grid: one wave per cell at a random spot, so they scatter but cover evenly
      function drawWaves(width, height, random) {
        // as many waves as the original picture has
        const target = 22;
        const cell = Math.sqrt((width * height) / target);
        const cols = Math.max(2, Math.round(width / cell));
        const rows = Math.ceil(target / cols);
        const cellW = width / cols;
        const cellH = height / rows;
        waves.setAttribute("viewBox", `0 0 ${width} ${height}`);
        waves.style.setProperty("--stroke", `${Math.min(7, Math.max(4, width / 250)).toFixed(1)}px`);
        waves.replaceChildren();
        // the grid can have a few more cells than waves; leave random ones empty
        const cells = [];
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) cells.push([col, row]);
        }
        for (let i = cells.length - 1; i > 0; i--) {
          const j = Math.floor(random() * (i + 1));
          [cells[i], cells[j]] = [cells[j], cells[i]];
        }
        for (const [col, row] of cells.slice(0, target)) {
          const w = Math.min(cellW * 0.85, Math.max(90, width * (0.075 + random() * 0.07)));
          const x = col * cellW + random() * (cellW - w);
          const y = row * cellH + cellH * (0.25 + random() * 0.5);
          const path = document.createElementNS(SVG_NS, "path");
          path.setAttribute("class", "wave");
          path.setAttribute("d", wavePath(x, y, w, w * 0.04));
          path.style.cssText = `--d:${(5 + random() * 4).toFixed(1)}s;--delay:-${(random() * 6).toFixed(1)}s;` +
            `--dx:${((random() < 0.5 ? -1 : 1) * w * (0.06 + random() * 0.08)).toFixed(0)}px`;
          waves.append(path);
        }
      }

      function layout() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        drawWaves(width, height, seeded(layoutSeed + 1));
        const random = seeded(layoutSeed);
        const blocked = [".lettering", ".backlink"].map(
          (selector) => box(document.querySelector(selector).getBoundingClientRect(), 12));
        const base = Math.sqrt(width * height) * 0.3;
        const placed = [];
        stage.replaceChildren();

        // more room, more unicorns: 5 on a phone up to 7 from a Full HD screen on
        const count = Math.min(7, Math.max(5, Math.round(5 + (Math.sqrt(width * height) - 575) / 433)));
        // mix of 2 large : 2 medium : 1 small, largest placed first;
        // a slight spread within a class keeps equal sizes from looking cloned
        const large = Math.round(count * 0.4);
        const small = Math.max(1, Math.round(count * 0.2));
        const medium = count - large - small;
        const spread = (factor, n) => Array.from({ length: n }, (_, i) => factor * (1 - i * 0.06));
        const factors = [...spread(LARGE, large), ...spread(MEDIUM, medium), ...spread(SMALL, small)];
        for (const factor of factors) {
          let spot = null;
          // shrink a unicorn a little before giving up on it
          for (let size = base * factor, attempt = 0; attempt < 3 && !spot; attempt++, size *= 0.85) {
            const w = size;
            const h = size * RATIO;
            // margin covers the sideways drift and the tilt of the bobbing
            const margin = w * 0.1;
            // best-candidate sampling: of several free random spots take the one farthest
            // from the unicorns already placed, so they spread evenly instead of clumping
            let bestDistance = -1;
            for (let i = 0, found = 0; i < 300 && found < 12; i++) {
              // keep the whole unicorn, including its drift and tilt, inside the viewport
              const x = margin + random() * (width - w - 2 * margin);
              const y = margin + random() * (height - h - 2 * margin);
              const candidate = { l: x - margin, t: y - margin, r: x + w + margin, b: y + h + margin };
              if (blocked.some((b) => overlaps(candidate, b)) || placed.some((b) => overlaps(candidate, b))) continue;
              found++;
              const [cx, cy] = centre(candidate);
              const distance = Math.min(Infinity, ...placed.map((b) => {
                const [px, py] = centre(b);
                return Math.hypot(cx - px, cy - py);
              }));
              if (distance > bestDistance) {
                bestDistance = distance;
                spot = { x, y, w, candidate };
              }
            }
          }
          if (!spot) continue;
          placed.push(spot.candidate);

          const delay = `-${(random() * 10).toFixed(1)}s`;
          const drift = document.createElement("div");
          drift.className = "drift";
          drift.style.cssText = `left:${spot.x}px;top:${spot.y}px;width:${spot.w}px;` +
            `--amp:${(spot.w * 0.06).toFixed(1)}px;--drift:${(15 + random() * 10).toFixed(1)}s;--delay:${delay}`;
          const bob = document.createElement("div");
          bob.className = "bob";
          bob.style.cssText = `--bob:${(5 + random() * 3.5).toFixed(1)}s;--delay:${delay}`;
          const img = document.createElement("img");
          img.src = UNICORN;
          img.alt = "";
          if (random() < 0.5) img.className = "mirrored";
          bob.append(img);
          drift.append(bob);
          stage.append(drift);
        }
      }

      let pending;
      window.addEventListener("resize", () => {
        clearTimeout(pending);
        pending = setTimeout(layout, 150);
      });
      window.addEventListener("load", layout);
    })();
  </script>
</body>
</html>
